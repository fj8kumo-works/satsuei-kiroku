<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>撮影記録</title>
<style>
  :root {
    --bg: #f4f3f0; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #dedcd6;
    --chip: #ecebe7; --chip-on: #1f4fa8; --chip-on-text: #fff; --accent: #1f4fa8;
    --danger: #b3261e; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113; --card: #1d1d20; --text: #f2f2f2; --muted: #9b9ba1; --line: #33333a;
      --chip: #2b2b31; --chip-on: #5b8def; --chip-on-text: #0b0b0c; --accent: #7fa6f5;
      --danger: #ff8a80; --ok: #7fd19f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    font-size: 16px; line-height: 1.5; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 120px; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header.top .in { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  header.top h1 { font-size: 1.1rem; margin: 0; flex: 1; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 88px; resize: vertical; }
  .section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px; margin: 12px 0; }
  .section > h2 { font-size: 1rem; margin: 0 0 8px; }
  .field { margin: 10px 0 14px; }
  .field > label { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { min-height: 44px; min-width: 52px; padding: 8px 12px; border-radius: 22px; border: 0;
    background: var(--chip); font-size: .95rem; }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); font-weight: 700; }
  .btn { min-height: 48px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); font-weight: 700; }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b0b0c; } }
  .btn.danger { color: var(--danger); }
  .btn.wide { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted { color: var(--muted); font-size: .85rem; }

  /* 一覧 */
  .search { margin: 4px 0 8px; }
  .rec { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px; margin: 8px 0; width: 100%; text-align: left; }
  .rec .thumb { width: 72px; height: 72px; flex: none; border-radius: 10px; background: var(--chip) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 1.4rem; }
  .rec .t { font-weight: 700; }
  .rec .s { color: var(--muted); font-size: .85rem; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; white-space: pre-line; }

  /* 下部の固定バー（親指で届く位置） */
  .bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg);
    border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .bottom .in { max-width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .bottom .btn { flex: 1; }
  .status { font-size: .8rem; color: var(--muted); min-width: 64px; text-align: right; }
  .status.saved { color: var(--ok); }

  /* ライト */
  .light { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .light .head { display: flex; align-items: center; justify-content: space-between; }
  .light .head b { font-size: 1rem; }
  .light .head button { border: 0; background: none; color: var(--danger); min-height: 44px; padding: 0 8px; }

  /* 写真 */
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .photos button { aspect-ratio: 1; border: 0; border-radius: 8px; background: var(--chip) center/cover no-repeat; padding: 0; }
  .viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 20; display: flex; flex-direction: column; }
  .viewer img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
  .viewer .in { display: flex; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .viewer .btn { flex: 1; background: #2a2a2e; color: #fff; border-color: #444; }
  .viewer .btn.danger { color: #ff8a80; }
  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #333; color: #fff;
    padding: 8px 16px; border-radius: 20px; font-size: .9rem; z-index: 30; }
</style>
</head>
<body>
<header class="top"><div class="in"><h1 id="title">撮影記録</h1><span id="headRight"></span></div></header>
<main id="main"></main>
<div class="bottom"><div class="in" id="bottom"></div></div>

<script>
"use strict";
// ================= 選択肢（ここを編集すれば候補を変えられます） =================
const OPT = {
  f:   ["2.8", "4", "5.6", "8", "11", "16", "22"],
  ss:  ["1/250", "1/160", "1/125", "1/60", "1/30", "1/15", "1/8", "1/4", "1/2", "1\"", "2\""],
  iso: ["100", "200", "400", "800", "1600", "3200"],
  wb:  ["オート", "太陽光", "曇天", "日陰", "電球", "蛍光灯", "5600K", "5000K", "3200K"],
  role:  ["メイン", "ハイライト", "シャドウ起こし", "キャッチライト", "輪郭(リム)", "背景"],
  pos:   ["左前", "正面", "右前", "左横", "右横", "真上", "左後ろ", "右後ろ", "下から"],
  power: ["100%", "75%", "50%", "25%", "10%", "1/1", "1/4", "1/16", "1/64"],
  bg:    ["白", "黒", "グレー", "青", "水色", "ピンク", "グラデ"],
  filter:["C-PL", "ブラックミスト 1/8", "ブラックミスト 1/4", "ソフト", "ND"],
};
const DEFAULT_GEAR = "α7C II ＋ 105mmマクロ";

// ================= データ保存（ブラウザ内の IndexedDB） =================
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("satsuei-kiroku", 1);
  r.onupgradeneeded = () => {
    const db = r.result;
    db.createObjectStore("records", { keyPath: "id" });
    db.createObjectStore("photos", { keyPath: "id" }).createIndex("recordId", "recordId");
  };
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function run(store, mode, fn) {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const DB = {
  all: () => run("records", "readonly", s => s.getAll()),
  get: id => run("records", "readonly", s => s.get(id)),
  put: rec => run("records", "readwrite", s => s.put(rec)),
  del: async id => {
    const ph = await DB.photosOf(id);
    await run("photos", "readwrite", s => ph.forEach(p => s.delete(p.id)));
    return run("records", "readwrite", s => s.delete(id));
  },
  photo: id => run("photos", "readonly", s => s.get(id)),
  photosOf: rid => run("photos", "readonly", s => s.index("recordId").getAll(rid)),
  allPhotos: () => run("photos", "readonly", s => s.getAll()),
  putPhoto: p => run("photos", "readwrite", s => s.put(p)),
  delPhoto: id => run("photos", "readwrite", s => s.delete(id)),
};
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ================= 小道具 =================
const $ = id => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k.startsWith("on")) e[k] = attrs[k];
    else if (k === "class") e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
function toast(msg) {
  const t = h("div", { class: "toast" }, msg);
  document.body.append(t); setTimeout(() => t.remove(), 1800);
}
let urls = [];
function objUrl(blob) { const u = URL.createObjectURL(blob); urls.push(u); return u; }
function freeUrls() { urls.forEach(u => URL.revokeObjectURL(u)); urls = []; }

function newRecord(base) {
  const r = {
    id: uid(), createdAt: Date.now(), updatedAt: Date.now(), date: today(),
    title: "", gear: DEFAULT_GEAR,
    camera: { f: "", ss: "", iso: "", wb: "" },
    lights: [], bg: "", filters: [], filterNote: "",
    good: "", bad: "", photoIds: [],
  };
  if (base) {  // 前回の設定を引き継ぐ（写真とメモは引き継がない）
    Object.assign(r, structuredClone({ title: base.title, gear: base.gear, camera: base.camera,
      lights: base.lights, bg: base.bg, filters: base.filters, filterNote: base.filterNote }));
  }
  return r;
}
function summary(r) {
  const c = r.camera, parts = [];
  if (c.f) parts.push("F" + c.f);
  if (c.ss) parts.push(c.ss);
  if (c.iso) parts.push("ISO" + c.iso);
  if (r.lights.length) parts.push(r.lights.length + "灯");
  if (r.bg) parts.push("背景:" + r.bg);
  return parts.join(" · ");
}

// ================= 画面切り替え =================
let current = null;      // 編集中の記録
let isStored = false;    // 一度でも保存されたか（何も入力せず戻ったら保存しない）
let saveTimer = null;

window.addEventListener("hashchange", route);
async function route() {
  await flush();
  freeUrls();
  const m = location.hash.match(/^#\/r\/(.+)$/);
  if (m) return showEdit(decodeURIComponent(m[1]));
  current = null;
  showList();
}

// ================= 一覧画面 =================
let query = "";
async function showList() {
  $("title").textContent = "撮影記録";
  $("headRight").replaceChildren(h("button", { class: "btn", onclick: showBackup }, "バックアップ"));
  const recs = (await DB.all()).sort((a, b) => (b.date + b.createdAt) > (a.date + a.createdAt) ? 1 : -1);
  const main = $("main");
  const list = h("div");
  const search = h("input", { class: "search", type: "search", placeholder: "🔍 作品名・背景・メモで探す", value: query });
  search.oninput = () => { query = search.value; draw(); };
  function draw() {
    const q = query.trim().toLowerCase();
    const hit = q ? recs.filter(r => [r.title, r.bg, r.good, r.bad, r.filters.join(" ")].join(" ").toLowerCase().includes(q)) : recs;
    list.replaceChildren(...(hit.length ? hit.map(card) :
      [h("div", { class: "empty" }, recs.length ? "見つかりませんでした" : "まだ記録がありません。\n下の「＋ 新しい記録」から始めましょう。")]));
  }
  function card(r) {
    const th = h("div", { class: "thumb" }, "📷");
    if (r.photoIds[0]) DB.photo(r.photoIds[0]).then(p => { if (p) { th.textContent = ""; th.style.backgroundImage = `url(${objUrl(p.thumb)})`; } });
    return h("button", { class: "rec", onclick: () => location.hash = "#/r/" + r.id }, th,
      h("div", null, h("div", { class: "t" }, r.title || "（作品名なし）"),
        h("div", { class: "s" }, r.date), h("div", { class: "s" }, summary(r))));
  }
  draw();
  main.replaceChildren(search, list);

  const latest = [...recs].sort((a, b) => b.updatedAt - a.updatedAt)[0];
  $("bottom").replaceChildren(
    ...(latest ? [h("button", { class: "btn", onclick: () => startNew(latest) }, "前回の設定で新規")] : []),
    h("button", { class: "btn primary", onclick: () => startNew(null) }, "＋ 新しい記録"));
}
let pendingNew = null;
async function startNew(base) {
  const rec = newRecord(base);
  // 設定を引き継いだ記録はすぐ保存（何も変えずに撮っても記録が残るように）。
  // 空の新規記録は、何か入力するまで保存しない。
  if (base) await DB.put(rec); else pendingNew = rec;
  location.hash = "#/r/" + rec.id;
}

// ================= 入力画面 =================
async function showEdit(id) {
  if (pendingNew && pendingNew.id === id) { current = pendingNew; isStored = false; pendingNew = null; }
  else {
    current = await DB.get(id);
    isStored = true;
    if (!current) { location.hash = "#/"; return; }
  }
  const r = current;
  $("title").textContent = isStored ? "記録を編集" : "新しい記録";
  $("headRight").replaceChildren();
  const status = h("span", { class: "status", id: "status" }, isStored ? "保存済み ✓" : "未入力");
  $("bottom").replaceChildren(
    h("button", { class: "btn primary", onclick: () => location.hash = "#/" }, "← 一覧へ（自動保存）"), status);

  const lightsBox = h("div");
  const photosBox = h("div", { class: "photos" });

  $("main").replaceChildren(
    h("div", { class: "section" }, h("h2", null, "被写体"),
      textField("作品名", () => r.title, v => r.title = v, "例：〇〇 1/7 スケール", titleList()),
      h("div", { class: "row" },
        textField("撮影日", () => r.date, v => r.date = v, "", null, "date"),
        textField("機材", () => r.gear, v => r.gear = v, ""))),

    h("div", { class: "section" }, h("h2", null, "カメラ"),
      chipField("F値", OPT.f, () => r.camera.f, v => r.camera.f = v, "その他の値（例：6.3）", "decimal"),
      chipField("シャッター速度", OPT.ss, () => r.camera.ss, v => r.camera.ss = v, "その他（例：1/100）"),
      chipField("ISO", OPT.iso, () => r.camera.iso, v => r.camera.iso = v, "その他（例：125）", "numeric"),
      chipField("ホワイトバランス", OPT.wb, () => r.camera.wb, v => r.camera.wb = v, "その他（例：5300K）")),

    h("div", { class: "section" }, h("h2", null, "ライト"), lightsBox,
      h("button", { class: "btn wide", onclick: () => { r.lights.push({ role: "", pos: "", power: "", note: "" }); drawLights(); changed(); } }, "＋ ライトを追加")),

    h("div", { class: "section" }, h("h2", null, "背景・フィルター"),
      chipField("背景紙の色", OPT.bg, () => r.bg, v => r.bg = v, "その他の色"),
      multiChipField("フィルター（複数選べます）", OPT.filter, r.filters),
      textField("フィルターのメモ", () => r.filterNote, v => r.filterNote = v, "例：C-PLは反射が消える向きで固定")),

    h("div", { class: "section" }, h("h2", null, "撮れた写真"), photosBox,
      photoAddButton()),

    h("div", { class: "section" }, h("h2", null, "メモ"),
      areaField("うまくいった点", () => r.good, v => r.good = v),
      areaField("反省点・次に試すこと", () => r.bad, v => r.bad = v)),

    h("div", { class: "section" }, h("h2", null, "この記録の操作"),
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: async () => { await flush(); startNew(r); } }, "この設定で新規"),
        h("button", { class: "btn danger", onclick: deleteRecord }, "この記録を削除"))),
  );

  function drawLights() {
    lightsBox.replaceChildren(...(r.lights.length ? r.lights.map((L, i) =>
      h("div", { class: "light" },
        h("div", { class: "head" }, h("b", null, `ライト ${i + 1}`),
          h("button", { onclick: () => { if (confirm(`ライト ${i + 1} を外しますか？`)) { r.lights.splice(i, 1); drawLights(); changed(); } } }, "外す")),
        chipField("役割", OPT.role, () => L.role, v => L.role = v, "その他の役割"),
        chipField("位置", OPT.pos, () => L.pos, v => L.pos = v, "細かい位置（例：左45°・高さ30cm）"),
        chipField("出力", OPT.power, () => L.power, v => L.power = v, "その他の出力"),
        textField("メモ（機材・ディフューザーなど）", () => L.note, v => L.note = v, "例：LEDパネル＋トレペ"))
    ) : [h("p", { class: "muted" }, "ライトなし（自然光など）。使う場合は下のボタンで追加。")]));
  }
  drawLights();

  async function drawPhotos() {
    const items = [];
    for (const pid of r.photoIds) {
      const p = await DB.photo(pid);
      if (!p) continue;
      const b = h("button", { onclick: () => viewPhoto(p) });
      b.style.backgroundImage = `url(${objUrl(p.thumb)})`;
      items.push(b);
    }
    photosBox.replaceChildren(...items);
  }
  drawPhotos();

  function photoAddButton() {
    const input = h("input", { type: "file", accept: "image/*", multiple: "" });
    input.style.display = "none";
    input.onchange = async () => {
      const files = [...input.files]; input.value = "";
      if (!files.length) return;
      toast(`写真を取り込み中…（${files.length}枚）`);
      for (const f of files) {
        try {
          const full = await resize(f, 1600, 0.85), thumb = await resize(f, 320, 0.75);
          const p = { id: uid(), recordId: r.id, blob: full, thumb };
          await DB.putPhoto(p);
          r.photoIds.push(p.id);
        } catch (e) { toast("読み込めない写真がありました"); console.error(e); }
      }
      await save(); drawPhotos();
    };
    return h("div", null, input, h("button", { class: "btn wide", onclick: () => input.click() }, "＋ 写真を追加"),
      h("p", { class: "muted" }, "写真はこの端末の中に、縮小（長辺1600px）して保存します。"));
  }

  function viewPhoto(p) {
    const v = h("div", { class: "viewer" }, h("img", { src: objUrl(p.blob), alt: "" }),
      h("div", { class: "in" },
        h("button", { class: "btn danger", onclick: async () => {
          if (!confirm("この写真を記録から外しますか？（元の写真はスマホに残ります）")) return;
          await DB.delPhoto(p.id); r.photoIds = r.photoIds.filter(x => x !== p.id);
          await save(); v.remove(); drawPhotos();
        } }, "この写真を外す"),
        h("button", { class: "btn", onclick: () => v.remove() }, "閉じる")));
    document.body.append(v);
  }

  async function deleteRecord() {
    if (!confirm("この記録を削除しますか？\n（元に戻せません。スマホ本体の写真は消えません）")) return;
    clearTimeout(saveTimer);
    if (isStored) await DB.del(r.id);
    current = null;
    toast("削除しました");
    location.hash = "#/";
  }
}

async function titleList() {
  const recs = await DB.all();
  return [...new Set(recs.map(r => r.title).filter(Boolean))];
}

// --- 入力部品 ---
function textField(label, get, set, placeholder, suggestions, type) {
  const input = h("input", { type: type || "text", placeholder: placeholder || "", value: get() || "" });
  input.oninput = () => { set(input.value); changed(); };
  const wrap = h("div", { class: "field" }, h("label", null, label), input);
  if (suggestions) {  // 過去の作品名を候補に出す
    const dl = h("datalist", { id: "dl" + uid() });
    input.setAttribute("list", dl.id);
    suggestions.then(list => dl.replaceChildren(...list.map(t => h("option", { value: t }))));
    wrap.append(dl);
  }
  return wrap;
}
function areaField(label, get, set) {
  const ta = h("textarea");
  ta.value = get() || "";
  ta.oninput = () => { set(ta.value); changed(); };
  return h("div", { class: "field" }, h("label", null, label), ta);
}
// ボタンで選べて、候補にない値は下の欄に打てる
function chipField(label, options, get, set, placeholder, inputmode) {
  const input = h("input", { type: "text", placeholder, value: get() || "" });
  if (inputmode) input.inputMode = inputmode;
  const row = h("div", { class: "chips" });
  const refresh = () => [...row.children].forEach(b => b.classList.toggle("on", b.dataset.v === input.value));
  for (const o of options) {
    const b = h("button", { class: "chip", type: "button", "data-v": o }, o);
    b.onclick = () => { input.value = input.value === o ? "" : o; set(input.value); refresh(); changed(); };
    row.append(b);
  }
  input.oninput = () => { set(input.value); refresh(); changed(); };
  refresh();
  return h("div", { class: "field" }, h("label", null, label), row, input);
}
function multiChipField(label, options, arr) {
  const row = h("div", { class: "chips" });
  const none = h("button", { class: "chip", type: "button" }, "なし");
  const refresh = () => {
    none.classList.toggle("on", arr.length === 0);
    [...row.children].forEach(b => b !== none && b.classList.toggle("on", arr.includes(b.dataset.v)));
  };
  none.onclick = () => { arr.splice(0); refresh(); changed(); };
  row.append(none);
  for (const o of options) {
    const b = h("button", { class: "chip", type: "button", "data-v": o }, o);
    b.onclick = () => { const i = arr.indexOf(o); i < 0 ? arr.push(o) : arr.splice(i, 1); refresh(); changed(); };
    row.append(b);
  }
  refresh();
  return h("div", { class: "field" }, h("label", null, label), row);
}

// --- 自動保存 ---
function changed() {
  const s = $("status"); if (s) { s.textContent = "保存中…"; s.className = "status"; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 400);
}
async function save() {
  clearTimeout(saveTimer); saveTimer = null;
  if (!current) return;
  current.updatedAt = Date.now();
  await DB.put(current);
  isStored = true;
  const s = $("status"); if (s) { s.textContent = "保存済み ✓"; s.className = "status saved"; }
}
async function flush() { if (saveTimer) await save(); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("pagehide", flush);

// --- 写真の縮小 ---
async function resize(file, max, quality) {
  let src;
  try { src = await createImageBitmap(file); }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, hh = src.height, k = Math.min(1, max / Math.max(w, hh));
  const c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(hh * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("toBlob failed")), "image/jpeg", quality));
}

// ================= バックアップ =================
const b64 = blob => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
const unb64 = url => fetch(url).then(r => r.blob());

function showBackup() {
  const input = h("input", { type: "file", accept: ".json,application/json" });
  input.style.display = "none";
  input.onchange = () => { const f = input.files[0]; input.value = ""; if (f) importBackup(f); };
  const v = h("div", { class: "viewer", style: "background:var(--bg);justify-content:center" },
    h("main", null,
      h("div", { class: "section" }, h("h2", null, "バックアップ"),
        h("p", { class: "muted" }, "記録はこのスマホのブラウザの中だけにあります。ブラウザのデータを消したり機種変更すると消えるので、ときどき書き出してください。"),
        h("p", { class: "muted" }, "別のスマホに記録を移すときも、書き出したファイルをそのスマホで読み込みます。"),
        h("button", { class: "btn primary wide", onclick: exportBackup }, "書き出す（ファイルに保存）"),
        h("div", { style: "height:10px" }),
        h("button", { class: "btn wide", onclick: () => input.click() }, "読み込む（ファイルから戻す）"), input,
        h("p", { class: "muted" }, "読み込みは「追加・上書き」だけで、今ある記録は消しません。"),
        h("div", { style: "height:10px" }),
        h("button", { class: "btn wide", onclick: () => v.remove() }, "閉じる"))));
  document.body.append(v);
}
async function exportBackup() {
  toast("書き出し中…");
  const records = await DB.all();
  const photos = [];
  for (const p of await DB.allPhotos()) photos.push({ id: p.id, recordId: p.recordId, blob: await b64(p.blob), thumb: await b64(p.thumb) });
  const name = `satsuei-kiroku-${today()}.json`;
  const blob = new Blob([JSON.stringify({ app: "satsuei-kiroku", version: 1, exportedAt: new Date().toISOString(), records, photos })], { type: "application/json" });
  // スマホでは共有メニュー（「ファイルに保存」「Googleドライブ」など）で保存する
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; }
    catch (e) { if (e.name === "AbortError") return; }  // キャンセル時は何もしない。それ以外の失敗は下のダウンロードへ
  }
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { return alert("このファイルは読み込めませんでした。"); }
  if (data.app !== "satsuei-kiroku") return alert("撮影記録のバックアップファイルではないようです。");
  if (!confirm(`記録 ${data.records.length} 件・写真 ${data.photos.length} 枚を読み込みます。\n同じ記録がある場合は、ファイルの内容で上書きします。`)) return;
  for (const p of data.photos) await DB.putPhoto({ id: p.id, recordId: p.recordId, blob: await unb64(p.blob), thumb: await unb64(p.thumb) });
  for (const r of data.records) await DB.put(r);
  document.querySelector(".viewer")?.remove();
  toast("読み込みました");
  showList();
}

// 電波がない場所でも開けるように、一度開いたアプリを端末に覚えさせる
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");

route();
</script>
